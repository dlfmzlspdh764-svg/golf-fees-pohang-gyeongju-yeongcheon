<title>포항·경주·영천 골프장 이용요금</title>
<style>
:root{--g:#0f5132;--g2:#198754;--bg:#f3f6f4;--card:#fff;--tx:#1b1f1d;--mu:#6b7570;--ln:#e3e8e5;--warn:#b54708;--warnbg:#fff4e5;--bad:#b42318;--badbg:#fdecea;--ok:#067647;--okbg:#e7f6ec;--live:#1d4ed8;--livebg:#eef4ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
header{background:linear-gradient(135deg,#0f5132,#198754);color:#fff;padding:18px 16px 14px}
header h1{margin:0;font-size:20px;letter-spacing:-.3px}
header p{margin:6px 0 0;font-size:12.5px;opacity:.9;line-height:1.5}
.upd{display:inline-block;margin-top:8px;background:rgba(255,255,255,.16);border-radius:999px;padding:4px 10px;font-size:12px}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--ln);padding:10px 12px 8px;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.row{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--ln);background:#fff;color:var(--tx);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--g);border-color:var(--g);color:#fff;font-weight:600}
.chip.date{padding:6px 10px;font-size:13px}
.chip.date.we{color:#c0362c}
.chip.date.on{color:#fff}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden;flex:0 0 auto}
.seg button{border:0;background:#fff;padding:7px 12px;font-size:14px;cursor:pointer;color:var(--tx)}
.seg button.on{background:var(--g2);color:#fff;font-weight:600}
select{flex:0 0 auto;border:1px solid var(--ln);border-radius:10px;padding:7px 8px;font-size:14px;background:#fff;color:var(--tx)}
.lbl{font-size:12px;color:var(--mu);flex:0 0 auto;margin-right:2px}
main{padding:10px 12px 30px;max-width:760px;margin:0 auto}
.summary{font-size:12.5px;color:var(--mu);margin:4px 2px 10px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.name{font-size:17px;font-weight:700;letter-spacing:-.3px}
.alias{font-size:12px;color:var(--mu);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:11.5px;border-radius:6px;padding:2px 7px;background:#eef2ef;color:#35403a}
.tag.city{background:#e6f0ff;color:#1e40af}
.st{font-size:11.5px;border-radius:6px;padding:3px 7px;white-space:nowrap;font-weight:600}
.st.verified{background:var(--okbg);color:var(--ok)}
.st.stale{background:var(--warnbg);color:var(--warn)}
.st.unverified{background:var(--badbg);color:var(--bad)}
.price{margin-top:10px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price .big{font-size:22px;font-weight:800;color:var(--g);letter-spacing:-.5px}
.price .unit{font-size:12.5px;color:var(--mu)}
.price .na{font-size:16px;font-weight:700;color:var(--bad)}
.sub{font-size:12.5px;color:var(--mu);margin-top:3px;line-height:1.5}
.fees{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.fee{background:#f7f9f8;border-radius:10px;padding:8px 10px}
.fee b{display:block;font-size:12px;color:var(--mu);font-weight:500}
.fee span{font-size:14.5px;font-weight:700}
.fee small{display:block;font-size:11.5px;color:var(--mu);margin-top:2px;line-height:1.4}
.live{margin-top:10px;background:var(--livebg);border-radius:10px;padding:9px 10px}
.live h4{margin:0 0 6px;font-size:12.5px;color:var(--live);display:flex;justify-content:space-between;gap:6px}
.live h4 small{font-weight:400;color:#51607a}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{background:#fff;border-radius:8px;text-align:center;padding:5px 2px;font-size:11px;line-height:1.35;border:1px solid transparent}
.day.sel{border-color:var(--live);box-shadow:0 0 0 1px var(--live) inset}
.day .d{color:#51607a}.day.we .d{color:#c0362c}
.day .p{font-weight:700;font-size:12px;color:#111}
.day .c{color:#7a869a;font-size:10.5px}
.day.none .p{color:#9aa4b2;font-weight:500}
.sel-live{margin-top:6px;font-size:13px;color:#1e3a8a}
.sel-live b{font-size:16px}
.warnbox{margin-top:8px;font-size:12.5px;background:var(--warnbg);color:var(--warn);border-radius:8px;padding:7px 9px;line-height:1.5}
.errbox{margin-top:8px;font-size:12.5px;background:var(--badbg);color:var(--bad);border-radius:8px;padding:7px 9px;line-height:1.5}
details{margin-top:8px}
summary{font-size:13px;color:var(--g2);cursor:pointer;font-weight:600}
details ul{margin:6px 0 0;padding-left:18px;font-size:12.5px;line-height:1.6;color:#333}
.meta{font-size:11.5px;color:var(--mu);margin-top:8px;line-height:1.55;word-break:break-all}
.meta a{color:var(--mu)}
.acts{display:flex;gap:6px;margin-top:10px}
.acts a{flex:1;text-align:center;text-decoration:none;border-radius:10px;padding:10px 4px;font-size:14px;font-weight:600;border:1px solid var(--ln);color:var(--tx);background:#fff}
.acts a.call{background:var(--g);color:#fff;border-color:var(--g)}
.acts a.book{background:#fff;color:var(--g);border-color:var(--g)}
footer{max-width:760px;margin:0 auto;padding:4px 16px 40px;font-size:12px;color:var(--mu);line-height:1.7}
footer h3{font-size:13px;color:var(--tx);margin:14px 0 4px}
.empty{text-align:center;color:var(--mu);padding:40px 0}

.tabs{position:sticky;top:0;z-index:6;display:flex;background:#fff;border-bottom:1px solid var(--ln)}
.tabs button{flex:1;border:0;background:#fff;padding:12px 4px;font-size:15px;font-weight:600;color:var(--mu);cursor:pointer;border-bottom:3px solid transparent}
.tabs button.on{color:var(--g);border-bottom-color:var(--g)}
body.dash .bar,body.dash #listMain{display:none}
body:not(.dash) #dash{display:none}
.bar{top:47px}
#dash{padding:10px 12px 20px;max-width:760px;margin:0 auto}
.sec{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.sec h3{margin:0 0 8px;font-size:15px;letter-spacing:-.3px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.sec h3 small{font-size:11.5px;color:var(--mu);font-weight:400}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:11px 12px;min-width:0}
.kpi b{display:block;font-size:11.5px;color:var(--mu);font-weight:500}
.kpi .v{font-size:22px;font-weight:800;color:var(--g);letter-spacing:-.5px;margin-top:2px;white-space:nowrap}
.kpi .v small{font-size:12px;font-weight:600;color:var(--mu);margin-left:2px}
.kpi .s{font-size:11.5px;color:var(--mu);margin-top:2px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi.hot{background:linear-gradient(135deg,#0f5132,#198754);border-color:#0f5132;color:#fff}
.kpi.hot b,.kpi.hot .s,.kpi.hot .v small{color:rgba(255,255,255,.85)}
.kpi.hot .v{color:#fff}
.kpi .v.sm{font-size:15px;white-space:normal;line-height:1.3}
.drow{margin:0 0 8px}
.rk{display:flex;align-items:center;gap:8px;padding:9px 2px;border-top:1px solid var(--ln);cursor:pointer}
.rk:first-child{border-top:0}
.rk .n{flex:0 0 22px;height:22px;border-radius:50%;background:#eef2ef;color:#35403a;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.rk:first-child .n{background:#f5b301;color:#fff}
.rk .m{flex:1;min-width:0}
.rk .t{font-size:14.5px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rk .i{font-size:11.5px;color:var(--mu);margin-top:2px}
.rk .pr{text-align:right;flex:0 0 auto}
.rk .pr b{font-size:16px;color:var(--g);font-weight:800}
.rk .pr div{font-size:11px;color:var(--mu)}
.cb{display:inline-block;font-size:10.5px;border-radius:5px;padding:1px 5px;margin-right:4px;font-weight:600;vertical-align:1px}
.cb.c포항{background:#e6f0ff;color:#1e40af}.cb.c경주{background:#fdf0e6;color:#9a3412}.cb.c영천{background:#f1e9fe;color:#6b21a8}
.cities{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.city{background:#f7f9f8;border-radius:10px;padding:9px 8px;text-align:center}
.city .cn{font-size:13px;font-weight:700}
.city .cc{font-size:11px;color:var(--mu);margin:2px 0 5px}
.city .mn{font-size:16px;font-weight:800;color:var(--g)}
.city .av{font-size:11.5px;color:#35403a;margin-top:2px}
.hm-wrap{overflow-x:auto;margin:0 -12px;padding:0 12px;-webkit-overflow-scrolling:touch}
table.hm{border-collapse:separate;border-spacing:3px;font-size:12px;min-width:100%}
.hm th{font-size:11px;font-weight:600;color:#51607a;padding:3px 2px;white-space:nowrap;text-align:center}
.hm th.we{color:#c0362c}
.hm th.cn,.hm td.cn{position:sticky;left:0;z-index:2;background:#fff;box-shadow:-4px 0 0 #fff,4px 0 0 #fff;text-align:left;font-size:12px;font-weight:600;max-width:108px;min-width:108px;line-height:1.25;word-break:keep-all;padding:2px 4px 2px 0;cursor:pointer}
.hm td.cn .cb{display:block;width:max-content;margin:0 0 1px}
.hm td.v{min-width:38px;height:30px;text-align:center;border-radius:6px;font-weight:700;color:#10241a;cursor:pointer}
.hm td.v.na{background:#f1f3f2;color:#b0b8b4;font-weight:400}
.legend{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mu);margin-top:8px}
.legend i{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,hsl(130,55%,72%),hsl(60,75%,70%),hsl(0,70%,72%))}
.chart text{font-family:inherit}
.note{font-size:11.5px;color:var(--mu);line-height:1.5;margin-top:6px}
.card.flash{animation:fl 1.6s ease}
@keyframes fl{0%,40%{box-shadow:0 0 0 3px var(--g2)}100%{box-shadow:none}}
@media (min-width:700px){.fees{grid-template-columns:repeat(4,1fr)}}
</style>
</head>

<header>

  <p>공식 홈페이지 요금표 + 예약 사이트 실시간 최저가(날짜별)를 한눈에 비교합니다.</p>

<section id="dash">
  <div class="kpis" id="kpis"></div>
  <div class="row drow" id="dCity"></div>
  <div class="sec"><h3>💰 최저가 TOP 5 <small id="topSub"></small></h3>
    <div class="row drow" id="dDate"></div>
    <div id="top5"></div></div>
  <div class="sec"><h3>🏙️ 지역별 요약 <small id="citySub"></small></h3><div class="cities" id="cities"></div>
    <div class="note">각 골프장의 18홀 최저가 기준 · 단위 원 · 실시간 가격이 있는 골프장만 계산</div></div>
  <div class="sec"><h3>📈 날짜별 전체 최저가 <small>18홀·1인</small></h3><div id="chart"></div></div>
  <div class="sec"><h3>🗓️ 7일 요금 히트맵 <small>단위 만원 · 칸을 누르면 이동</small></h3>
    <div class="hm-wrap"><table class="hm" id="hm"></table></div>
    <div class="legend">저렴<i></i>비쌈</div>
    <div class="note" id="hmNote"></div></div>
</section>

<div class="bar">
  <div class="row" id="cityRow"></div>
  <div class="row" style="margin-top:6px">
    <div class="seg" id="modeSeg">
      <button data-v="official" class="on">공식 요금표</button>
      <button data-v="live">실시간 최저가</button>
    </div>
    <div class="seg" id="daySeg">
      <button data-v="weekday" class="on">평일</button>
      <button data-v="weekend">주말·공휴일</button>
    </div>
    <select id="sort" aria-label="정렬">
      <option value="asc">낮은 가격순</option>
      <option value="desc">높은 가격순</option>
      <option value="name">이름순</option>
    </select>
  </div>
  <div class="row" id="dateRow" style="margin-top:6px;display:none"></div>
</div>

<main id="listMain">
  <div class="summary" id="summary"></div>
  <div id="list"></div>
</main>

<footer id="foot"></footer>

<script>
const EMBEDDED = /*__EMBEDDED_DATA__*/null;
const PREFER_JSON = false;
const S = {city:'전체', mode:'official', day:'weekday', sort:'asc', date:null};
let D = null;

const won = n => (n===null||n===undefined) ? '' : n.toLocaleString('ko-KR');
const esc = s => String(s??'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function kst(iso){
  if(!iso) return '-';
  const d = new Date(iso);
  const p = new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}).formatToParts(d);
  const g = t => (p.find(x=>x.type===t)||{}).value;
  return `${g('year')}.${g('month')}.${g('day')} ${g('hour')}:${g('minute')} KST`;
}
const STATUS = {verified:'공식 요금 확인', stale:'게시표 확인 필요', unverified:'확인 필요'};

function liveOf(c){ return D.live && D.live.courses ? D.live.courses[c.id] : null; }
function liveDay(c, date){ const l = liveOf(c); return l && l.days ? l.days[date] : null; }

function sortKey(c){
  if(S.mode==='live'){
    const v = liveDay(c, S.date);
    return v && v.min18 ? v.min18 : null;
  }
  const o = c.official, r = o && o[S.day];
  return (o && o.status!=='unverified' && r) ? r.min : null;
}

function render(){
  const list = document.getElementById('list');
  let cs = D.courses.filter(c => S.city==='전체' || c.city===S.city);
  cs.sort((a,b)=>{
    if(S.sort==='name') return a.name.localeCompare(b.name,'ko');
    const ka = sortKey(a), kb = sortKey(b);
    if(ka===null && kb===null) return a.name.localeCompare(b.name,'ko');
    if(ka===null) return 1; if(kb===null) return -1;
    return S.sort==='asc' ? ka-kb : kb-ka;
  });
  const cnt = {verified:0, stale:0, unverified:0};
  cs.forEach(c=>cnt[c.official.status]++);
  const liveN = cs.filter(c => { const v = S.date && liveDay(c,S.date); return v && v.min18; }).length;
  document.getElementById('summary').innerHTML =
    `${S.city==='전체'?'포항·경주·영천':S.city} 골프장 <b>${cs.length}곳</b> · 공식 요금 확인 ${cnt.verified} · 게시표 확인 필요 ${cnt.stale} · 확인 필요 ${cnt.unverified}` +
    (S.mode==='live' ? `<br>실시간 최저가(${esc(dateLabel(S.date))}) 확인 ${liveN}곳 · 금액은 1인 18홀 기준 그린피(카트·캐디 별도)` : `<br>금액은 1인 그린피 기준(원). 카트비·캐디피는 팀당 별도입니다.`);
  list.innerHTML = cs.length ? cs.map(card).join('') : '<div class="empty">조건에 맞는 골프장이 없습니다.</div>';
}

function dateLabel(ds){ const m = (D.live?.dates||[]).find(x=>x.date===ds); return m ? m.label : ds; }

function card(c){
  const o = c.official || {};
  const r = o[S.day];
  const dayTxt = S.day==='weekday' ? '평일' : '주말·공휴일';
  let priceHtml = '';
  if(S.mode==='live'){
    const v = liveDay(c, S.date);
    if(v && v.min18){
      priceHtml = `<div class="price"><span class="big">${won(v.min18)}원</span><span class="unit">${esc(dateLabel(S.date))} 실시간 최저가 · ${esc(v.min18_time||'')} 티오프</span></div>
      <div class="sub">예약 가능 티타임 ${v.count18}개${v.parts?(' · '+Object.entries(v.parts).sort().map(([k,x])=>`${k} ${won(x)}`).join(' / ')):''}</div>`;
    } else if(v && v.min9){
      priceHtml = `<div class="price"><span class="big">${won(v.min9)}원</span><span class="unit">${esc(dateLabel(S.date))} 9홀 상품 최저가</span></div>`;
    } else {
      priceHtml = `<div class="price"><span class="na">실시간 가격 없음</span><span class="unit">${liveOf(c)?'해당 날짜 공개 티타임 없음':'실시간 제공처 없음(아래 공식 요금 참고)'}</span></div>`;
    }
    if(o.status!=='unverified' && r) priceHtml += `<div class="sub">공식 요금표 ${dayTxt}: ${won(r.min)}${r.max!==r.min?'~'+won(r.max):''}원 (${esc(o.basis||'')})</div>`;
  } else {
    if(o.status!=='unverified' && r){
      priceHtml = `<div class="price"><span class="big">${won(r.min)}${r.max!==r.min?' ~ '+won(r.max):''}원</span><span class="unit">${dayTxt} · ${esc(o.basis||'')}</span></div>
        <div class="sub">적용 기간: ${esc(o.period||'-')}</div>`;
    } else {
      priceHtml = `<div class="price"><span class="na">요금 확인 필요</span></div><div class="sub">${esc(o.note||'')}</div>`;
    }
  }
  const feeBox = (label, v, note) => `<div class="fee"><b>${label}</b><span>${v===null||v===undefined?'확인 필요':(v===0?'없음':won(v)+'원')}</span>${note?`<small>${esc(note)}</small>`:''}</div>`;
  const cart = (o.cart===null||o.cart===undefined) && o.cart_note ? `<div class="fee"><b>카트비</b><span>${/인/.test(o.cart_note)?'인원별':'별도'}</span><small>${esc(o.cart_note)}</small></div>` : feeBox('카트비(팀)', o.cart, o.cart_note);
  const caddie = (o.caddie===null||o.caddie===undefined) && o.caddie_note ? `<div class="fee"><b>캐디피</b><span>${/노캐디/.test(o.caddie_note)?'노캐디':(/미표기/.test(o.caddie_note)?'미표기':'별도')}</span><small>${esc(o.caddie_note)}</small></div>` : feeBox('캐디피(팀)', o.caddie, o.caddie_note);
  const wkd = o.weekday, wke = o.weekend;
  const both = (o.status!=='unverified' && wkd && wke) ?
     `<div class="fee"><b>평일 그린피</b><span>${won(wkd.min)}${wkd.max!==wkd.min?'~'+won(wkd.max):''}</span></div><div class="fee"><b>주말 그린피</b><span>${won(wke.min)}${wke.max!==wke.min?'~'+won(wke.max):''}</span></div>` : '';
  const l = liveOf(c);
  let liveHtml = '';
  if(l && D.live.dates){
    const cells = D.live.dates.map(dm=>{
      const v = l.days[dm.date] || {};
      const p = v.min18 ? (v.min18>=10000? (Math.round(v.min18/1000)/10).toString().replace(/\.0$/,'')+'만' : won(v.min18)) : (v.min9 ? '9홀 '+(v.min9/10000)+'만' : '-');
      return `<div class="day ${dm.weekend?'we':''} ${v.min18||v.min9?'':'none'} ${S.mode==='live'&&dm.date===S.date?'sel':''}"><div class="d">${esc(dm.label)}</div><div class="p">${p}</div><div class="c">${v.count18?v.count18+'팀':''}</div></div>`;
    }).join('');
    liveHtml = `<div class="live"><h4>📅 날짜별 실시간 최저가 (1인·18홀) <small>티스캐너 · ${esc(kst(D.live.fetched_at))}</small></h4><div class="days">${cells}</div></div>`;
  }
  const warn = [];
  if(o.changed) warn.push(`<div class="warnbox">⚠️ ${esc(o.changed_note)}</div>`);
  if(o.status==='stale' && o.note) warn.push(`<div class="warnbox">⚠️ ${esc(o.note)}</div>`);
  if(o.check_error) warn.push(`<div class="errbox">${esc(o.check_error)}</div>`);
  const rows = (o.rows||[]).map(x=>`<li>${esc(x)}</li>`).join('');
  const extra = rows || (o.note && o.status!=='unverified') ? `<details><summary>요금 상세 보기</summary><ul>${rows}${o.note&&o.status!=='stale'?`<li>${esc(o.note)}</li>`:''}${o.image_url?`<li><a href="${esc(o.image_url)}" target="_blank" rel="noopener">요금표 이미지 원본</a></li>`:''}</ul></details>` : '';
  const tel = (c.phone||'').replace(/[^0-9]/g,'');
  return `<article class="card" id="c-${esc(c.id)}">
    <div class="top"><div><div class="name">${esc(c.name)}</div>${c.aliases&&c.aliases.length?`<div class="alias">${esc(c.aliases.join(' · '))}</div>`:''}
      <div class="tags"><span class="tag city">${esc(c.city)}</span><span class="tag">${c.holes}홀</span><span class="tag">${esc(c.type)}</span></div></div>
      <span class="st ${o.status}">${STATUS[o.status]||''}</span></div>
    ${priceHtml}
    <div class="fees">${both}${cart}${caddie}</div>
    ${liveHtml}
    ${warn.join('')}
    ${extra}
    <div class="meta">📍 ${esc(c.address)}<br>공식 요금 출처: <a href="${esc(o.source_url)}" target="_blank" rel="noopener">${esc(o.source_url)}</a><br>기준일: ${esc(kst(o.auto_parsed_at||o.checked_at||D.meta.verified_at))} 확인${l?` · 실시간: <a href="${esc(l.url)}" target="_blank" rel="noopener">티스캐너</a>`:''}</div>
    <div class="acts">${tel?`<a class="call" href="tel:${tel}">📞 ${esc(c.phone)}</a>`:''}<a class="book" href="${esc(c.booking_url||c.website)}" target="_blank" rel="noopener">예약하기</a><a href="${esc(o.source_url)}" target="_blank" rel="noopener">요금표</a></div>
  </article>`;
}


// ---------------------------------------------------------------- 대시보드
const DS = {city:'전체', date:'week'};
const man = v => { const x = Math.round(v/1000)/10; return (x%1===0? x.toFixed(0) : x.toFixed(1)); };
const cb = city => `<span class="cb c${esc(city)}">${esc(city)}</span>`;
function dCourses(){ return D.courses.filter(c => DS.city==='전체' || c.city===DS.city); }
// 선택 날짜(또는 7일) 기준 골프장별 최저 18홀 가격
function bestOf(c, date){
  const l = liveOf(c); if(!l || !l.days) return null;
  const ds = date==='week' ? (D.live.dates||[]).map(x=>x.date) : [date];
  let b = null;
  ds.forEach(d=>{ const v = l.days[d]; if(v && v.min18 && (!b || v.min18 < b.min18)) b = {...v, date:d}; });
  return b;
}
function hasTee(c, date){ const v = liveDay(c, date); return !!(v && (v.count18 || v.count)); }
function heat(v, lo, hi){ const t = hi>lo ? (v-lo)/(hi-lo) : 0; const h = 130 - 130*t; return `hsl(${h.toFixed(0)},${(55+20*Math.sin(Math.PI*t)).toFixed(0)}%,72%)`; }

function goCourse(id, date){
  const c = D.courses.find(x=>x.id===id); if(!c) return;
  if(S.city!=='전체' && S.city!==c.city){ S.city='전체'; [...document.getElementById('cityRow').children].forEach(x=>x.classList.toggle('on',x.dataset.v==='전체')); }
  if(date && D.live && D.live.dates && D.live.dates.some(x=>x.date===date)){
    S.mode='live'; S.date=date;
    [...document.getElementById('modeSeg').children].forEach(x=>x.classList.toggle('on',x.dataset.v==='live'));
    document.getElementById('dateRow').style.display='flex'; document.getElementById('daySeg').style.display='none';
    [...document.querySelectorAll('#dateRow button')].forEach(x=>x.classList.toggle('on',x.dataset.v===date));
  }
  setTab('list'); render();
  const el = document.getElementById('c-'+id);
  if(el){ const y = el.getBoundingClientRect().top + window.scrollY - document.querySelector('.bar').offsetHeight - 54; window.scrollTo({top:y}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}
function setTab(t){
  document.body.classList.toggle('dash', t==='dash');
  [...document.getElementById('tabs').children].forEach(x=>x.classList.toggle('on',x.dataset.v===t));
  if(t==='dash') window.scrollTo({top:0});
}

function renderDash(){
  const dates = D.live?.dates || [];
  const cs = dCourses();
  const liveCs = cs.filter(c=>liveOf(c));
  // KPI
  let best = null;
  liveCs.forEach(c=>{ const b = bestOf(c,'week'); if(b && (!best || b.min18 < best.min18 || (b.min18===best.min18 && b.date<best.date))) best = {...b, c}; });
  const tee = d => d ? cs.filter(c=>hasTee(c,d.date)).length : null;
  const d0 = dates[0], d1 = dates[1];
  const where = DS.city==='전체' ? '포항·경주·영천' : DS.city;
  document.getElementById('kpis').innerHTML = `
    <div class="kpi"><b>골프장 수 · ${esc(where)}</b><div class="v">${cs.length}<small>곳</small></div><div class="s">실시간 가격 제공 ${liveCs.length}곳</div></div>
    <div class="kpi hot" ${best?`onclick="goCourse('${esc(best.c.id)}','${best.date}')" style="cursor:pointer"`:''}><b>7일 내 18홀 최저가</b><div class="v">${best?won(best.min18)+'<small>원</small>':'-'}</div><div class="s">${best?`${esc(best.c.name)} · ${esc(dateLabel(best.date))} ${esc(best.min18_time||'')}`:'-'}</div></div>
    <div class="kpi"><b>예약 가능 골프장 (오늘/내일)</b><div class="v">${tee(d0)??'-'}<small>/</small>${tee(d1)??'-'}<small>곳</small></div><div class="s">${d0?esc(d0.label):'-'} / ${d1?esc(d1.label):'-'} 기준</div></div>
    <div class="kpi"><b>데이터 갱신 (KST)</b><div class="v sm">${esc(kst(D.live?.fetched_at||D.meta.generated_at).replace(' KST',''))}</div><div class="s">티스캐너 실시간 수집 시각</div></div>`;
  // 날짜 칩
  const dd = document.getElementById('dDate');
  dd.innerHTML = `<button class="chip date ${DS.date==='week'?'on':''}" data-v="week">7일 전체</button>` + dates.map(d=>`<button class="chip date ${(d.weekend||d.holiday)?'we':''} ${d.date===DS.date?'on':''}" data-v="${d.date}">${esc(d.label)}</button>`).join('');
  const selLbl = DS.date==='week' ? '7일 전체' : dateLabel(DS.date);
  // TOP5
  const rows = liveCs.map(c=>({c, b:bestOf(c, DS.date)})).filter(x=>x.b).sort((a,b)=>a.b.min18-b.b.min18 || a.c.name.localeCompare(b.c.name,'ko'));
  document.getElementById('topSub').textContent = `${selLbl} · 18홀·1인`;
  document.getElementById('top5').innerHTML = rows.length ? rows.slice(0,5).map((x,i)=>`
    <div class="rk" onclick="goCourse('${esc(x.c.id)}','${x.b.date}')"><div class="n">${i+1}</div>
      <div class="m"><div class="t">${esc(x.c.name)}</div><div class="i">${cb(x.c.city)}${x.c.holes}홀 · ${DS.date==='week'?esc(dateLabel(x.b.date))+' ':''}${esc(x.b.min18_time||'-')} 티오프</div></div>
      <div class="pr"><b>${won(x.b.min18)}원</b><div>티타임 ${x.b.count18 ?? x.b.count ?? '-'}개</div></div></div>`).join('')
    : '<div class="empty" style="padding:18px 0">해당 날짜의 실시간 18홀 가격이 없습니다.</div>';
  // 지역 요약 (지역 필터와 무관하게 3개 지역 모두 표시)
  document.getElementById('citySub').textContent = selLbl;
  document.getElementById('cities').innerHTML = ['포항','경주','영천'].map(city=>{
    const all = D.courses.filter(c=>c.city===city);
    const ps = all.map(c=>bestOf(c, DS.date)).filter(Boolean).map(b=>b.min18);
    const mn = ps.length ? Math.min(...ps) : null, av = ps.length ? Math.round(ps.reduce((a,b)=>a+b,0)/ps.length/1000)*1000 : null;
    return `<div class="city"><div class="cn">${cb(city)}</div><div class="cc">${all.length}곳 · 가격 ${ps.length}곳</div><div class="mn">${mn?won(mn):'-'}</div><div class="av">평균 ${av?won(av):'-'}</div></div>`;
  }).join('');
  // 막대 차트
  const mins = dates.map(d=>{ let m=null, who=null; liveCs.forEach(c=>{ const v=liveDay(c,d.date); if(v&&v.min18&&(m===null||v.min18<m)){m=v.min18;who=c;} }); return {d,m,who}; });
  const W=360,H=150,pt=22,pb=34,bw=W/Math.max(dates.length,1);
  const mx = Math.max(...mins.map(x=>x.m||0), 1);
  document.getElementById('chart').innerHTML = dates.length ? `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="날짜별 최저가">
    ${mins.map((x,i)=>{ const cx=i*bw+bw/2; const we=x.d.weekend||x.d.holiday; const sel = DS.date===x.d.date;
      if(!x.m) return `<text x="${cx}" y="${H-pb-6}" font-size="11" text-anchor="middle" fill="#9aa4b2">-</text><text x="${cx}" y="${H-pb+16}" font-size="10.5" text-anchor="middle" fill="${we?'#c0362c':'#51607a'}">${esc(x.d.label.replace(/\(.\)/,''))}</text><text x="${cx}" y="${H-pb+29}" font-size="10" text-anchor="middle" fill="${we?'#c0362c':'#7a869a'}">${esc((x.d.label.match(/\((.)\)/)||[])[1]||'')}</text>`;
      const h=(H-pt-pb)*x.m/mx; const y=H-pb-h;
      return `<g style="cursor:pointer" onclick="DS.date='${x.d.date}';renderDash()"><rect x="${cx-bw*0.3}" y="${y}" width="${bw*0.6}" height="${h}" rx="4" fill="${sel?'#0f5132':(we?'#e8857c':'#6fbf8e')}"/>
        <text x="${cx}" y="${y-5}" font-size="11" font-weight="700" text-anchor="middle" fill="#1b1f1d">${man(x.m)}만</text>
        <text x="${cx}" y="${H-pb+16}" font-size="10.5" text-anchor="middle" fill="${we?'#c0362c':'#51607a'}">${esc(x.d.label.replace(/\(.\)/,''))}</text>
        <text x="${cx}" y="${H-pb+29}" font-size="10" text-anchor="middle" fill="${we?'#c0362c':'#7a869a'}">${esc((x.d.label.match(/\((.)\)/)||[])[1]||'')}</text></g>`; }).join('')}
    <line x1="0" y1="${H-pb}" x2="${W}" y2="${H-pb}" stroke="#e3e8e5"/></svg>
    <div class="note">막대를 누르면 위 TOP 5·지역 요약이 그 날짜로 바뀝니다. 빨간색 = 주말·공휴일</div>` : '<div class="empty">실시간 데이터 없음</div>';
  // 히트맵
  const vals = []; liveCs.forEach(c=>dates.forEach(d=>{ const v=liveDay(c,d.date); if(v&&v.min18) vals.push(v.min18); }));
  const lo = vals.length?Math.min(...vals):0, hi = vals.length?Math.max(...vals):0;
  const hcs = [...cs].sort((a,b)=>{ const x=bestOf(a,'week'), y=bestOf(b,'week'); if(!x&&!y) return a.name.localeCompare(b.name,'ko'); if(!x) return 1; if(!y) return -1; return x.min18-y.min18; });
  document.getElementById('hm').innerHTML = `<thead><tr><th class="cn">골프장</th>${dates.map(d=>`<th class="${(d.weekend||d.holiday)?'we':''}">${esc(d.label).replace('(','<br>(')}</th>`).join('')}</tr></thead><tbody>` +
    hcs.map(c=>{ const l=liveOf(c);
      return `<tr><td class="cn" onclick="goCourse('${esc(c.id)}')" title="${esc(c.name)}">${cb(c.city)}${esc(c.name)}</td>` + dates.map(d=>{ const v=l&&l.days?l.days[d.date]:null;
        return v&&v.min18 ? `<td class="v" style="background:${heat(v.min18,lo,hi)}" onclick="goCourse('${esc(c.id)}','${d.date}')" title="${esc(c.name)} ${esc(d.label)} ${won(v.min18)}원">${man(v.min18)}</td>` : `<td class="v na" onclick="goCourse('${esc(c.id)}'${l?`,'${d.date}'`:''})">${l?'-':'·'}</td>`; }).join('') + '</tr>'; }).join('') + '</tbody>';
  const noLive = cs.filter(c=>!liveOf(c)).map(c=>c.name);
  document.getElementById('hmNote').innerHTML = `범위 ${vals.length?won(lo)+'~'+won(hi)+'원':'-'} · '-' = 공개 티타임 없음` + (noLive.length?`<br>'·' = 실시간 제공처 없음: ${esc(noLive.join(', '))}`:'');
}
function setupDash(){
  const cities = ['전체','포항','경주','영천'];
  const dc = document.getElementById('dCity');
  dc.innerHTML = cities.map(c=>`<button class="chip ${c===DS.city?'on':''}" data-v="${c}">${c}${c==='전체'?'':' ('+D.courses.filter(x=>x.city===c).length+')'}</button>`).join('');
  dc.onclick = e => { const b=e.target.closest('button'); if(!b) return; DS.city=b.dataset.v; [...dc.children].forEach(x=>x.classList.toggle('on',x===b)); renderDash(); };
  document.getElementById('dDate').onclick = e => { const b=e.target.closest('button'); if(!b) return; DS.date=b.dataset.v; renderDash(); };
  document.getElementById('tabs').onclick = e => { const b=e.target.closest('button'); if(!b) return; setTab(b.dataset.v); };
  renderDash();
}

function setup(){
  document.getElementById('upd').textContent = `데이터 갱신: ${kst(D.meta.generated_at)}` + (D.live?` · 실시간 수집: ${kst(D.live.fetched_at)}`:'');
  const cities = ['전체','포항','경주','영천'];
  const cr = document.getElementById('cityRow');
  cr.innerHTML = cities.map(c=>`<button class="chip ${c===S.city?'on':''}" data-v="${c}">${c}${c==='전체'?'':' ('+D.courses.filter(x=>x.city===c).length+')'}</button>`).join('');
  cr.onclick = e => { const b=e.target.closest('button'); if(!b) return; S.city=b.dataset.v; [...cr.children].forEach(x=>x.classList.toggle('on',x===b)); render(); };
  const segs = (id,key,after) => { const el=document.getElementById(id); el.onclick = e => { const b=e.target.closest('button'); if(!b) return; S[key]=b.dataset.v; [...el.children].forEach(x=>x.classList.toggle('on',x===b)); after&&after(); render(); }; };
  segs('daySeg','day');
  segs('modeSeg','mode',()=>{ document.getElementById('dateRow').style.display = S.mode==='live'?'flex':'none'; document.getElementById('daySeg').style.display = S.mode==='live'?'none':'inline-flex'; });
  document.getElementById('sort').onchange = e => { S.sort=e.target.value; render(); };
  const dates = D.live?.dates || [];
  if(dates.length){
    S.date = dates[Math.min(1,dates.length-1)].date;
    const dr = document.getElementById('dateRow');
    dr.innerHTML = '<span class="lbl">날짜</span>' + dates.map(d=>`<button class="chip date ${d.weekend?'we':''} ${d.date===S.date?'on':''}" data-v="${d.date}">${esc(d.label)}</button>`).join('');
    dr.onclick = e => { const b=e.target.closest('button'); if(!b) return; S.date=b.dataset.v; [...dr.querySelectorAll('button')].forEach(x=>x.classList.toggle('on',x===b)); render(); };
  } else {
    document.querySelector('#modeSeg [data-v=live]').disabled = true;
  }
  document.getElementById('foot').innerHTML = `
    <h3>데이터 안내</h3>
    ${(D.meta.notes||[]).map(n=>`• ${esc(n)}`).join('<br>')}
    <br>• 골프장 목록: ${esc(D.meta.course_list_source)}
    <br>• 공식 요금 최초 검증: ${esc(kst(D.meta.verified_at))}
    <h3>상태 표시</h3>
    <b style="color:var(--ok)">공식 요금 확인</b>: 공식 홈페이지 요금표에서 직접 확인 · <b style="color:var(--warn)">게시표 확인 필요</b>: 게시 기간이 지났거나 불분명 · <b style="color:var(--bad)">확인 필요</b>: 공식 요금표를 확인하지 못함(전화·홈페이지로 확인하세요)
    <h3>주의</h3>
    실제 결제 금액은 예약 경로, 인원, 시간대, 이벤트, 공휴일 여부에 따라 달라질 수 있습니다. 예약 전 반드시 골프장에 확인하세요.`;
  render();
  setupDash();
}

async function boot(){
  if(PREFER_JSON){
    try{ const r = await fetch('data.json?t='+Date.now(), {cache:'no-store'}); if(r.ok){ D = await r.json(); } }catch(e){}
  }
  if(!D) D = EMBEDDED;
  if(!D){ document.getElementById('list').innerHTML='<div class="empty">데이터를 불러오지 못했습니다.</div>'; return; }
  setup();
}
boot();
</script>
