name: 요금 자동 갱신

on:
  schedule:
    - cron: '0 21 * * *'   # 매일 06:00 KST (UTC 21:00)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 요금 수집 및 페이지 생성
        run: python refresh.py

      - name: 변경 사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json teetimes.json index.html golf-fees.html monitor_state.json
          if git diff --cached --quiet; then
            echo "변경 없음"
          else
            git commit -m "요금 자동 갱신 $(date '+%Y-%m-%d %H:%M KST')"
            git push origin HEAD:main
          fi
