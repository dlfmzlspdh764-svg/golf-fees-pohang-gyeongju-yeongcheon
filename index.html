<title>포항·경주·영천 골프장 이용요금</title>
<style>
:root{--g:#0f5132;--g2:#198754;--bg:#f3f6f4;--card:#fff;--tx:#1b1f1d;--mu:#6b7570;--ln:#e3e8e5;--warn:#b54708;--warnbg:#fff4e5;--bad:#b42318;--badbg:#fdecea;--ok:#067647;--okbg:#e7f6ec;--live:#1d4ed8;--livebg:#eef4ff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;-webkit-text-size-adjust:100%}
header{background:linear-gradient(135deg,#0f5132,#198754);color:#fff;padding:18px 16px 14px}
header h1{margin:0;font-size:20px;letter-spacing:-.3px}
header p{margin:6px 0 0;font-size:12.5px;opacity:.9;line-height:1.5}
.upd{display:inline-block;margin-top:8px;background:rgba(255,255,255,.16);border-radius:999px;padding:4px 10px;font-size:12px}
.bar{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--ln);padding:10px 12px 8px;box-shadow:0 2px 6px rgba(0,0,0,.04)}
.row{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.row::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--ln);background:#fff;color:var(--tx);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--g);border-color:var(--g);color:#fff;font-weight:600}
.chip.date{padding:6px 10px;font-size:13px}
.chip.date.we{color:#c0362c}
.chip.date.on{color:#fff}
.seg{display:inline-flex;border:1px solid var(--ln);border-radius:10px;overflow:hidden;flex:0 0 auto}
.seg button{border:0;background:#fff;padding:7px 12px;font-size:14px;cursor:pointer;color:var(--tx)}
.seg button.on{background:var(--g2);color:#fff;font-weight:600}
select{flex:0 0 auto;border:1px solid var(--ln);border-radius:10px;padding:7px 8px;font-size:14px;background:#fff;color:var(--tx)}
.lbl{font-size:12px;color:var(--mu);flex:0 0 auto;margin-right:2px}
main{padding:10px 12px 30px;max-width:760px;margin:0 auto}
.summary{font-size:12.5px;color:var(--mu);margin:4px 2px 10px;line-height:1.5}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:10px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.name{font-size:17px;font-weight:700;letter-spacing:-.3px}
.alias{font-size:12px;color:var(--mu);margin-top:2px}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.tag{font-size:11.5px;border-radius:6px;padding:2px 7px;background:#eef2ef;color:#35403a}
.tag.city{background:#e6f0ff;color:#1e40af}
.st{font-size:11.5px;border-radius:6px;padding:3px 7px;white-space:nowrap;font-weight:600}
.st.verified{background:var(--okbg);color:var(--ok)}
.st.stale{background:var(--warnbg);color:var(--warn)}
.st.unverified{background:var(--badbg);color:var(--bad)}
.price{margin-top:10px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.price .big{font-size:22px;font-weight:800;color:var(--g);letter-spacing:-.5px}
.price .unit{font-size:12.5px;color:var(--mu)}
.price .na{font-size:16px;font-weight:700;color:var(--bad)}
.sub{font-size:12.5px;color:var(--mu);margin-top:3px;line-height:1.5}
.fees{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:10px}
.fee{background:#f7f9f8;border-radius:10px;padding:8px 10px}
.fee b{display:block;font-size:12px;color:var(--mu);font-weight:500}
.fee span{font-size:14.5px;font-weight:700}
.fee small{display:block;font-size:11.5px;color:var(--mu);margin-top:2px;line-height:1.4}
.live{margin-top:10px;background:var(--livebg);border-radius:10px;padding:9px 10px}
.live h4{margin:0 0 6px;font-size:12.5px;color:var(--live);display:flex;justify-content:space-between;gap:6px}
.live h4 small{font-weight:400;color:#51607a}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.day{background:#fff;border-radius:8px;text-align:center;padding:5px 2px;font-size:11px;line-height:1.35;border:1px solid transparent}
.day.sel{border-color:var(--live);box-shadow:0 0 0 1px var(--live) inset}
.day .d{color:#51607a}.day.we .d{color:#c0362c}
.day .p{font-weight:700;font-size:12px;color:#111}
.day .c{color:#7a869a;font-size:10.5px}
.day.none .p{color:#9aa4b2;font-weight:500}
.sel-live{margin-top:6px;font-size:13px;color:#1e3a8a}
.sel-live b{font-size:16px}
.warnbox{margin-top:8px;font-size:12.5px;background:var(--warnbg);color:var(--warn);border-radius:8px;padding:7px 9px;line-height:1.5}
.errbox{margin-top:8px;font-size:12.5px;background:var(--badbg);color:var(--bad);border-radius:8px;padding:7px 9px;line-height:1.5}
details{margin-top:8px}
summary{font-size:13px;color:var(--g2);cursor:pointer;font-weight:600}
details ul{margin:6px 0 0;padding-left:18px;font-size:12.5px;line-height:1.6;color:#333}
.meta{font-size:11.5px;color:var(--mu);margin-top:8px;line-height:1.55;word-break:break-all}
.meta a{color:var(--mu)}
.acts{display:flex;gap:6px;margin-top:10px}
.acts a{flex:1;text-align:center;text-decoration:none;border-radius:10px;padding:10px 4px;font-size:14px;font-weight:600;border:1px solid var(--ln);color:var(--tx);background:#fff}
.acts a.call{background:var(--g);color:#fff;border-color:var(--g)}
.acts a.book{background:#fff;color:var(--g);border-color:var(--g)}
footer{max-width:760px;margin:0 auto;padding:4px 16px 40px;font-size:12px;color:var(--mu);line-height:1.7}
footer h3{font-size:13px;color:var(--tx);margin:14px 0 4px}
.empty{text-align:center;color:var(--mu);padding:40px 0}

.tabs{position:sticky;top:0;z-index:6;display:flex;background:#fff;border-bottom:1px solid var(--ln)}
.tabs button{flex:1;border:0;background:#fff;padding:12px 4px;font-size:15px;font-weight:600;color:var(--mu);cursor:pointer;border-bottom:3px solid transparent}
.tabs button.on{color:var(--g);border-bottom-color:var(--g)}
body:not(.v-list) .bar,body:not(.v-list) #listMain{display:none}
body:not(.v-dash) #dash{display:none}
body:not(.v-time) #tsv{display:none}
.tabs button{font-size:14px;padding:12px 2px}
#tsv{padding:10px 12px 20px;max-width:760px;margin:0 auto}
.tctl{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:10px 10px 6px;margin-bottom:10px}
.tctl .row{margin-bottom:4px}
.tctl select{max-width:150px}
.hg{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px}
.hc{border-radius:8px;padding:5px 4px;text-align:center;cursor:pointer;line-height:1.3;border:2px solid transparent}
.hc .h{font-size:11px;color:#35403a;font-weight:600}
.hc .pv{font-size:13.5px;font-weight:800;color:#10241a}
.hc .ct{font-size:10.5px;color:#4b5563}
.hc.none{background:#f1f3f2;cursor:default}.hc.none .pv,.hc.none .h,.hc.none .ct{color:#b0b8b4}
.hc.inb{border-color:var(--g)}
.hc.min .pv:after{content:" ★";color:#b45309;font-size:11px}
.hr{display:grid;grid-template-columns:34px 1fr 64px 40px;align-items:center;gap:6px;font-size:12px;padding:3px 0;cursor:pointer}
.hr .h{color:#51607a;font-weight:600}
.hr .bw{background:#f1f3f2;border-radius:4px;height:14px;overflow:hidden}
.hr .bw i{display:block;height:100%;border-radius:4px;background:#6fbf8e}
.hr.inb .bw i{background:var(--g)}
.hr.min .bw i{background:#f5b301}
.hr .pv{text-align:right;font-weight:700}
.hr .ct{text-align:right;color:var(--mu);font-size:11px}
.hr.none{opacity:.45}
.tg{background:#fff;border:1px solid var(--ln);border-radius:14px;margin-bottom:10px;overflow:hidden}
.tg>.th{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:11px 12px;border-bottom:1px solid var(--ln);background:#fafcfb}
.tg>.th .t{font-size:15.5px;font-weight:700;letter-spacing:-.3px;min-width:0}
.tg>.th .t small{display:block;font-size:11.5px;color:var(--mu);font-weight:400;margin-top:2px}
.tg>.th .r{text-align:right;flex:0 0 auto}
.tg>.th .r b{font-size:16px;color:var(--g);font-weight:800}
.tg>.th .r div{font-size:11px;color:var(--mu)}
.tt{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid #f0f3f1}
.tt:first-of-type{border-top:0}
.tt .tm{flex:0 0 46px;font-size:15px;font-weight:700;font-variant-numeric:tabular-nums}
.tt .tm small{display:block;font-size:10.5px;color:var(--mu);font-weight:500}
.tt .md{flex:1;min-width:0;font-size:12px;color:#35403a;line-height:1.45}
.tt .md .cn{font-size:13.5px;font-weight:700;color:var(--tx);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tt .md .x{display:flex;flex-wrap:wrap;gap:3px;margin-top:2px}
.tt .md .x span{font-size:10.5px;border-radius:5px;padding:1px 5px;background:#eef2ef;color:#35403a}
.tt .md .x span.nc{background:#fff4e5;color:#b54708}
.tt .md .x span.h9{background:#eef4ff;color:#1d4ed8}
.tt .md .x span.sp{background:#fdecea;color:#b42318;font-weight:700}
.tt .md .nt{font-size:11px;color:var(--mu);margin-top:2px}
.tt .pr{flex:0 0 auto;text-align:right}
.tt .pr b{font-size:15.5px;font-weight:800;color:var(--g)}
.tt .pr s{display:block;font-size:11px;color:#9aa4b2}
.tt.best .pr b{color:#c2410c}
.more{display:block;width:100%;border:0;border-top:1px solid var(--ln);background:#fff;color:var(--g2);font-weight:600;font-size:13.5px;padding:10px;cursor:pointer}
.tgl{display:flex;gap:6px;margin-top:6px}
.tgl a{flex:1;text-align:center;text-decoration:none;font-size:13px;font-weight:600;border:1px solid var(--g);color:var(--g);border-radius:9px;padding:7px 4px}
.acts a.tm{background:#eef4ff;color:#1d4ed8;border-color:#c7d7fe}
.day{cursor:pointer}
.bar{top:47px}
#dash{padding:10px 12px 20px;max-width:760px;margin:0 auto}
.sec{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:12px;margin-bottom:10px}
.sec h3{margin:0 0 8px;font-size:15px;letter-spacing:-.3px;display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.sec h3 small{font-size:11.5px;color:var(--mu);font-weight:400}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.kpi{background:#fff;border:1px solid var(--ln);border-radius:14px;padding:11px 12px;min-width:0}
.kpi b{display:block;font-size:11.5px;color:var(--mu);font-weight:500}
.kpi .v{font-size:22px;font-weight:800;color:var(--g);letter-spacing:-.5px;margin-top:2px;white-space:nowrap}
.kpi .v small{font-size:12px;font-weight:600;color:var(--mu);margin-left:2px}
.kpi .s{font-size:11.5px;color:var(--mu);margin-top:2px;line-height:1.4;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kpi.hot{background:linear-gradient(135deg,#0f5132,#198754);border-color:#0f5132;color:#fff}
.kpi.hot b,.kpi.hot .s,.kpi.hot .v small{color:rgba(255,255,255,.85)}
.kpi.hot .v{color:#fff}
.kpi .v.sm{font-size:15px;white-space:normal;line-height:1.3}
.drow{margin:0 0 8px}
.rk{display:flex;align-items:center;gap:8px;padding:9px 2px;border-top:1px solid var(--ln);cursor:pointer}

    <div class="acts">${tel?`<a class="call" href="tel:${tel}">📞 ${esc(c.phone)}</a>`:''}${l?`<a class="tm" href="javascript:void 0" onclick="goTimes('${esc(c.id)}',S.mode==='live'?S.date:null)">⏰ 시간대별</a>`:''}<a class="book" href="${esc(c.booking_url||c.website)}" target="_blank" rel="noopener">예약하기</a>${l?'':`<a href="${esc(o.source_url)}" target="_blank" rel="noopener">요금표</a>`}</div>

// ---------------------------------------------------------------- 대시보드
const DS = {city:'전체', date:'week'};
const man = v => { const x = Math.round(v/1000)/10; return (x%1===0? x.toFixed(0) : x.toFixed(1)); };
const cb = city => `<span class="cb c${esc(city)}">${esc(city)}</span>`;
function dCourses(){ return D.courses.filter(c => DS.city==='전체' || c.city===DS.city); }
// 선택 날짜(또는 7일) 기준 골프장별 최저 18홀 가격
function bestOf(c, date){
  const l = liveOf(c); if(!l || !l.days) return null;
  const ds = date==='week' ? (D.live.dates||[]).map(x=>x.date) : [date];
  let b = null;
  ds.forEach(d=>{ const v = l.days[d]; if(v && v.min18 && (!b || v.min18 < b.min18)) b = {...v, date:d}; });
  return b;
}
function hasTee(c, date){ const v = liveDay(c, date); return !!(v && (v.count18 || v.count)); }
function heat(v, lo, hi){ const t = hi>lo ? (v-lo)/(hi-lo) : 0; const h = 130 - 130*t; return `hsl(${h.toFixed(0)},${(55+20*Math.sin(Math.PI*t)).toFixed(0)}%,72%)`; }

function goCourse(id, date){
  const c = D.courses.find(x=>x.id===id); if(!c) return;
  if(S.city!=='전체' && S.city!==c.city){ S.city='전체'; [...document.getElementById('cityRow').children].forEach(x=>x.classList.toggle('on',x.dataset.v==='전체')); }
  if(date && D.live && D.live.dates && D.live.dates.some(x=>x.date===date)){
    S.mode='live'; S.date=date;
    [...document.getElementById('modeSeg').children].forEach(x=>x.classList.toggle('on',x.dataset.v==='live'));
    document.getElementById('dateRow').style.display='flex'; document.getElementById('daySeg').style.display='none';
    [...document.querySelectorAll('#dateRow button')].forEach(x=>x.classList.toggle('on',x.dataset.v===date));
  }
  setTab('list'); render();
  const el = document.getElementById('c-'+id);
  if(el){ const y = el.getBoundingClientRect().top + window.scrollY - document.querySelector('.bar').offsetHeight - 54; window.scrollTo({top:y}); el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
}
function setTab(t){
  document.body.classList.remove('v-dash','v-list','v-time'); document.body.classList.add('v-'+t);
  [...document.getElementById('tabs').children].forEach(x=>x.classList.toggle('on',x.dataset.v===t));
  if(t==='dash') window.scrollTo({top:0});
  if(t==='time'){ window.scrollTo({top:0}); renderTimes(); }
}

  const W=360,H=150,pt=22,pb=34,bw=W/Math.max(dates.length,1);

  // 히트맵

// ---------------------------------------------------------------- 시간대별
const TS = {date:null, band:'all', city:'전체', course:'', holes:'18', mode:'course', sort:'time', open:{}, lim:60};
let TT = null, TTload = null;
const BANDS = [['all','전체'],['dawn','새벽 ~07시'],['am','오전 07–11'],['pm','오후 11–16'],['eve','야간·후반 16시~']];
const bandOf = tm => { const h = +tm.slice(0,2); return h<7?'dawn':h<11?'am':h<16?'pm':'eve'; };
const BANDN = {dawn:'새벽',am:'오전',pm:'오후',eve:'야간'};
function loadTT(){
  if(TT) return Promise.resolve(TT);
  if(!TTload) TTload = (async()=>{
    if(PREFER_JSON){ try{ const r = await fetch('teetimes.json?t='+Date.now(), {cache:'no-store'}); if(r.ok) TT = await r.json(); }catch(e){} }
    if(!TT) TT = EMBEDDED_TT;
    return TT;
  })();
  return TTload;
}
function ttRows(cid, date){
  const rs = TT && TT.courses && TT.courses[cid] && TT.courses[cid][date]; if(!rs) return [];
  const d = TT.dict;
  return rs.map(r=>({t:r[0], p:r[1], op:r[2], h:r[3], cs:r[4]>=0?d.course[r[4]]:'', cd:r[5]>=0?d.caddie[r[5]]:'', nt:r[6]>=0?d.note[r[6]]:'', tg:r[7]>=0?d.tag[r[7]]:'', f4:r[8]===1, cid}));
}
function goTimes(id, date){
  const c = D.courses.find(x=>x.id===id);
  if(c){ TS.course = id; TS.city = '전체'; TS.mode = 'course'; TS.open[id] = true; }
  if(date && (D.live?.dates||[]).some(x=>x.date===date)) TS.date = date;
  TS.band = 'all'; TS.holes = '18';
  setTab('time');
}
function holesOk(r){ return TS.holes==='all' || (TS.holes==='9' ? r.h===9 : (r.h===18||r.h===99)); }
function holesTxt(h){ return h===9?'9홀':(h===99?'18홀(9홀×2)':(h===0?'18/9홀 표기 불일치':'18홀')); }
async function renderTimes(){
  const dates = D.live?.dates || [];
  if(!TS.date && dates.length) TS.date = dates[Math.min(1,dates.length-1)].date;
  const chips = (arr, cur) => arr.map(([v,l,cls])=>`<button class="chip ${cls||''} ${v===cur?'on':''}" data-v="${esc(v)}">${esc(l)}</button>`).join('');
  document.getElementById('tDate').innerHTML = '<span class="lbl">날짜</span>' + chips(dates.map(d=>[d.date,d.label,'date'+((d.weekend||d.holiday)?' we':'')]), TS.date);
  document.getElementById('tBand').innerHTML = '<span class="lbl">시간</span>' + chips(BANDS, TS.band);
  document.getElementById('tCity').innerHTML = '<span class="lbl">지역</span>' + chips(['전체','포항','경주','영천'].map(c=>[c,c]), TS.city);
  const liveCs = D.courses.filter(c=>liveOf(c) && (TS.city==='전체' || c.city===TS.city));
  if(TS.course && !liveCs.some(c=>c.id===TS.course)) TS.course = '';
  document.getElementById('tCourse').innerHTML = `<option value="">전체 골프장 (${liveCs.length})</option>` + liveCs.map(c=>`<option value="${esc(c.id)}" ${c.id===TS.course?'selected':''}>${esc(c.name)}</option>`).join('');
  [['tHoles','holes'],['tMode','mode'],['tSort','sort']].forEach(([id,k])=>[...document.getElementById(id).children].forEach(b=>b.classList.toggle('on',b.dataset.v===TS[k])));
  ['tDate','tBand','tCity'].forEach(id=>{ const r=document.getElementById(id), on=r.querySelector('.on'); if(on) r.scrollLeft = Math.max(0, on.offsetLeft - r.clientWidth/2 + on.offsetWidth/2); });
  const list = document.getElementById('tList');
  if(!TT){ list.innerHTML = '<div class="empty">티타임 상세를 불러오는 중…</div>'; document.getElementById('tHours').innerHTML=''; await loadTT(); if(!TT){ list.innerHTML='<div class="empty">티타임 상세 데이터를 불러오지 못했습니다.</div>'; return; } }
  const cs = TS.course ? liveCs.filter(c=>c.id===TS.course) : liveCs;
  const base = []; cs.forEach(c=>ttRows(c.id, TS.date).forEach(r=>{ if(holesOk(r)) base.push(r); }));
  const rows = base.filter(r=>TS.band==='all' || bandOf(r.t)===TS.band);
  const cmap = Object.fromEntries(D.courses.map(c=>[c.id,c]));
  // 시각별 요약 (시간 필터와 무관, 선택 시간대 강조)
  const hrs = {}; base.forEach(r=>{ const h=+r.t.slice(0,2); const x = hrs[h] || (hrs[h]={m:null,n:0,who:null}); x.n++; if(x.m===null||r.p<x.m){x.m=r.p;x.who=r.cid;} });
  const hk = Object.keys(hrs).map(Number); 
  const hmin = hk.length?Math.min(...hk):0, hmax = hk.length?Math.max(...hk):-1;
  const ps = hk.map(h=>hrs[h].m), lo = ps.length?Math.min(...ps):0, hi = ps.length?Math.max(...ps):0;
  let hh = '';
  for(let h=hmin; h<=hmax; h++){
    const x = hrs[h]; const b = bandOf(String(h).padStart(2,'0'));
    if(!x){ hh += `<div class="hc none"><div class="h">${h}시</div><div class="pv">-</div><div class="ct">없음</div></div>`; continue; }
    hh += `<div class="hc ${TS.band===b?'inb':''} ${x.m===lo?'min':''}" data-b="${b}" style="background:${heat(x.m,lo,hi)}" title="${esc(cmap[x.who]?.name||'')} ${won(x.m)}원"><div class="h">${h}시</div><div class="pv">${man(x.m)}만</div><div class="ct">${x.n}개</div></div>`;
  }
  document.getElementById('tHours').innerHTML = hh ? `<div class="hg">${hh}</div>` : '<div class="empty" style="padding:14px 0">해당 조건의 티타임이 없습니다.</div>';
  const whoTxt = TS.course ? (cmap[TS.course]?.name||'') : (TS.city==='전체'?'전체 골프장':TS.city);
  document.getElementById('tHourSub').textContent = `${dateLabel(TS.date)} · ${whoTxt} · ${TS.holes==='all'?'전체':TS.holes+'홀'}`;
  const sorter = TS.sort==='price' ? (a,b)=>a.p-b.p||a.t.localeCompare(b.t) : (a,b)=>a.t.localeCompare(b.t)||a.p-b.p;
  const minAll = rows.length ? Math.min(...rows.map(r=>r.p)) : null;
  const ttHtml = (r, showCourse) => {
    const c = cmap[r.cid];
    const tags = [];
    tags.push(`<span class="${r.h===9?'h9':(r.h===0?'nc':'')}">${holesTxt(r.h)}</span>`);
    if(r.cd) tags.push(`<span class="${/노캐디/.test(r.cd)?'nc':''}">${esc(r.cd)}</span>`);
    if(r.tg) tags.push(`<span class="sp">${esc(r.tg)}</span>`);
    if(r.op) tags.push(`<span class="sp">할인</span>`);
    if(r.f4) tags.push(`<span class="nc">4인 필수</span>`);
    const nt = r.nt && r.nt!==r.cd ? r.nt.split(/,\s*/).filter(x=>x && x!==r.cd).join(', ') : '';
    return `<div class="tt ${r.p===minAll?'best':''}"><div class="tm">${esc(r.t)}<small>${BANDN[bandOf(r.t)]}</small></div>
      <div class="md">${showCourse?`<div class="cn">${cb(c.city)}${esc(c.name)}</div>`:''}${r.cs?`<div>코스 · ${esc(r.cs)}</div>`:''}<div class="x">${tags.join('')}</div>${nt?`<div class="nt">${esc(nt)}</div>`:''}</div>
      <div class="pr"><b>${won(r.p)}원</b>${r.op?`<s>${won(r.op)}원</s>`:''}</div></div>`;
  };
  const bandTxt = TS.band==='all' ? '전체 시간' : BANDS.find(x=>x[0]===TS.band)[1];
  document.getElementById('tSum').innerHTML = `${esc(dateLabel(TS.date))} · ${esc(bandTxt)} · 티타임 <b>${rows.length}개</b>${minAll?` · 최저 <b>${won(minAll)}원</b>`:''}<br>1인 그린피 기준(티스캐너 공개 가격, 카트·캐디피 별도) · 수집 ${esc(kst(TT.fetched_at))}`;
  if(!rows.length){ list.innerHTML = '<div class="empty">선택한 조건에 예약 가능한 티타임이 없습니다.</div>'; return; }
  if(TS.mode==='all'){
    const all = [...rows].sort(sorter), n = Math.min(all.length, TS.lim);
    list.innerHTML = `<div class="tg">${all.slice(0,n).map(r=>ttHtml(r,true)).join('')}${all.length>n?`<button class="more" data-more="1">더 보기 (${all.length-n}개 남음)</button>`:''}</div>`;
    return;
  }
  const groups = cs.map(c=>({c, rs:rows.filter(r=>r.cid===c.id).sort(sorter)})).filter(g=>g.rs.length)
    .sort((a,b)=>Math.min(...a.rs.map(r=>r.p))-Math.min(...b.rs.map(r=>r.p)) || a.c.name.localeCompare(b.c.name,'ko'));
  const none = cs.filter(c=>!groups.some(g=>g.c.id===c.id)).map(c=>c.name);
  list.innerHTML = groups.map(g=>{
    const mn = Math.min(...g.rs.map(r=>r.p)), op = TS.open[g.c.id] || groups.length===1, n = op ? g.rs.length : Math.min(5, g.rs.length);
    const l = liveOf(g.c);
    return `<div class="tg"><div class="th"><div class="t">${cb(g.c.city)}${esc(g.c.name)}<small>티타임 ${g.rs.length}개 · ${esc(g.rs[0].t)}~${esc(g.rs[g.rs.length-1].t)}${TS.sort==='price'?' · 가격순':''}</small></div><div class="r"><b>${won(mn)}원~</b><div>최저 1인</div></div></div>
      ${g.rs.slice(0,n).map(r=>ttHtml(r,false)).join('')}
      ${g.rs.length>n?`<button class="more" data-open="${esc(g.c.id)}">전체 ${g.rs.length}개 보기</button>`:''}
      ${op?`<div class="tgl" style="padding:0 12px 10px"><a href="${esc(l.url)}" target="_blank" rel="noopener">티스캐너에서 예약</a><a href="javascript:void 0" onclick="goCourse('${esc(g.c.id)}','${TS.date}')">골프장 정보</a></div>`:''}</div>`;
  }).join('') + (none.length?`<div class="note">이 조건에 공개 티타임 없음: ${esc(none.join(', '))}</div>`:'');
}
function setupTimes(){
  const on = (id, fn) => document.getElementById(id).addEventListener('click', e => { const b=e.target.closest('button,.hc'); if(!b) return; fn(b); renderTimes(); });
  on('tDate', b=>{ TS.date=b.dataset.v; TS.lim=60; });
  on('tBand', b=>{ TS.band=b.dataset.v; TS.lim=60; });
  on('tCity', b=>{ TS.city=b.dataset.v; TS.course=''; });
  on('tHoles', b=>{ TS.holes=b.dataset.v; });
  on('tMode', b=>{ TS.mode=b.dataset.v; TS.lim=60; });
  on('tSort', b=>{ TS.sort=b.dataset.v; });
  on('tHours', b=>{ if(b.dataset.b) TS.band = TS.band===b.dataset.b ? 'all' : b.dataset.b; });
  document.getElementById('tCourse').onchange = e => { TS.course = e.target.value; if(TS.course) TS.open[TS.course]=true; renderTimes(); };
  document.getElementById('tList').addEventListener('click', e => { const b=e.target.closest('button'); if(!b) return; if(b.dataset.open){ TS.open[b.dataset.open]=true; renderTimes(); } else if(b.dataset.more){ TS.lim+=60; renderTimes(); } });
  if(PREFER_JSON) setTimeout(loadTT, 800);
}

function setup(){
  document.getElementById('upd').textContent = `데이터 갱신: ${kst(D.meta.generated_at)}` + (D.live?` · 실시간 수집: ${kst(D.live.fetched_at)}`:'');
  const cities = ['전체','포항','경주','영천'];
  const cr = document.getElementById('cityRow');
  cr.innerHTML = cities.map(c=>`<button class="chip ${c===S.city?'on':''}" data-v="${c}">${c}${c==='전체'?'':' ('+D.courses.filter(x=>x.city===c).length+')'}</button>`).join('');
  cr.onclick = e => { const b=e.target.closest('button'); if(!b) return; S.city=b.dataset.v; [...cr.children].forEach(x=>x.classList.toggle('on',x===b)); render(); };
  const segs = (id,key,after) => { const el=document.getElementById(id); el.onclick = e => { const b=e.target.closest('button'); if(!b) return; S[key]=b.dataset.v; [...el.children].forEach(x=>x.classList.toggle('on',x===b)); after&&after(); render(); }; };
  segs('daySeg','day');
  segs('modeSeg','mode',()=>{ document.getElementById('dateRow').style.display = S.mode==='live'?'flex':'none'; document.getElementById('daySeg').style.display = S.mode==='live'?'none':'inline-flex'; });
  document.getElementById('sort').onchange = e => { S.sort=e.target.value; render(); };
  const dates = D.live?.dates || [];
  if(dates.length){
    S.date = dates[Math.min(1,dates.length-1)].date;
    const dr = document.getElementById('dateRow');
    dr.innerHTML = '<span class="lbl">날짜</span>' + dates.map(d=>`<button class="chip date ${d.weekend?'we':''} ${d.date===S.date?'on':''}" data-v="${d.date}">${esc(d.label)}</button>`).join('');
    dr.onclick = e => { const b=e.target.closest('button'); if(!b) return; S.date=b.dataset.v; [...dr.querySelectorAll('button')].forEach(x=>x.classList.toggle('on',x===b)); render(); };
  } else {
    document.querySelector('#modeSeg [data-v=live]').disabled = true;
  }
  document.getElementById('foot').innerHTML = `
    <h3>데이터 안내</h3>
    ${(D.meta.notes||[]).map(n=>`• ${esc(n)}`).join('<br>')}
    <br>• 골프장 목록: ${esc(D.meta.course_list_source)}
    <br>• 공식 요금 최초 검증: ${esc(kst(D.meta.verified_at))}
    <h3>상태 표시</h3>
    <b style="color:var(--ok)">공식 요금 확인</b>: 공식 홈페이지 요금표에서 직접 확인 · <b style="color:var(--warn)">게시표 확인 필요</b>: 게시 기간이 지났거나 불분명 · <b style="color:var(--bad)">확인 필요</b>: 공식 요금표를 확인하지 못함(전화·홈페이지로 확인하세요)
    <h3>주의</h3>
    실제 결제 금액은 예약 경로, 인원, 시간대, 이벤트, 공휴일 여부에 따라 달라질 수 있습니다. 예약 전 반드시 골프장에 확인하세요.`;
  render();
  setupDash();
  setupTimes();
}

async function boot(){
  if(PREFER_JSON){
    try{ const r = await fetch('data.json?t='+Date.now(), {cache:'no-store'}); if(r.ok){ D = await r.json(); } }catch(e){}
  }
  if(!D) D = EMBEDDED;
  if(!D){ document.getElementById('list').innerHTML='<div class="empty">데이터를 불러오지 못했습니다.</div>'; return; }
  setup();
}
boot();
</script>
